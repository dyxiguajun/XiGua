[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xigua"
version = "1.0.0"
description = "A tiny static site generator for a personal homepage and Markdown blog."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "XiGua contributors" }]
keywords = ["static-site-generator", "blog", "markdown", "personal-website"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
  "Jinja2>=3.1",
  "Markdown>=3.5",
  "Pygments>=2.16",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
xigua = "xigua.cli:main"

[project.urls]
Homepage = "https://github.com/dyxiguajun/XiGua"
Issues = "https://github.com/dyxiguajun/XiGua/issues"

[tool.setuptools.packages.find]
include = ["xigua*"]

[tool.setuptools.package-data]
xigua = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
